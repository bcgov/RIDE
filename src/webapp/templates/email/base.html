{# DBC22-6697: RIDE email layout, from DBC22-7322's notification_base.html, shared by notification and admin emails #}
<body style="margin:0; padding:0; font-family:'BC Sans', 'Noto Sans', Helvetica, Arial, sans-serif; font-size:16px; line-height:27px; font-weight:400; color:#2D2D2D; -webkit-font-smoothing:antialiased">
    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#F1F8FE" style="padding:50px 0">
      <tr>
        <td align="center" valign="top">
          <!-- Email container -->
          <table role="presentation" width="620" cellspacing="0" cellpadding="0" border="0" align="center" bgcolor="#FFFFFF" style="width:620px; max-width:100%; border-top:4px solid #F8BB47">
            <!-- Body -->
            <tr>
              <td style="padding:24px 24px 30px">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td bgcolor="#FAF9F8" style="padding:24px; border-top:4px solid #FCBA19">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  {% block footer_note %}{% endblock %}
                  <tr>
                    <td style="padding-top:16px; border-top:1px solid #9F9D9C">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                          <td style="white-space:nowrap">
                            <img src="cid:bclogo" alt="Government of British Columbia" width="131" style="width:131px" />
                          </td>
                          <td align="right" style="white-space:nowrap">
                            <a href="https://twitter.com/DriveBC" target="_blank" rel="noopener noreferrer" style="margin-right:16px">
                              <img src="cid:twitter" width="48" height="48" style="width:48px; height:48px; vertical-align:middle" alt="DriveBC X" />
                            </a>
                            <a href="https://www.instagram.com/ministryoftranbc/" target="_blank" rel="noopener noreferrer" style="margin-right:16px">
                              <img src="cid:instagram" width="48" height="48" style="width:48px; height:48px; vertical-align:middle" alt="DriveBC Instagram" />
                            </a>
                            <a href="https://www.linkedin.com/company/british-columbia-ministry-of-transportation-and-transit/" target="_blank" rel="noopener noreferrer">
                              <img src="cid:linkedin" width="48" height="48" style="width:48px; height:48px; vertical-align:middle" alt="DriveBC LinkedIn" />
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>

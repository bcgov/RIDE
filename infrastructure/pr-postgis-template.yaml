# OpenShift template for the temporary PostGIS database used by a PR preview environment.
# Creates the connection secret, persistent storage, database deployment, service, and network policy.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: pr-postgis-database
parameters:
  - name: PR
    required: true
  - name: DB_NAME
    required: true
  - name: DB_SECRET
    required: true
  - name: DB_NAME_BASE64
    required: true
  - name: DB_PASSWORD_BASE64
    required: true
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${DB_SECRET}
      labels:
        app.kubernetes.io/instance: ${DB_NAME}
    type: Opaque
    data:
      host: ${DB_NAME_BASE64}
      port: NTQzMg==
      user: cmlkZQ==
      password: ${DB_PASSWORD_BASE64}
      dbname: ${DB_NAME_BASE64}
      POSTGRES_USER: cmlkZQ==
      POSTGRES_PASSWORD: ${DB_PASSWORD_BASE64}
      POSTGRES_DB: ${DB_NAME_BASE64}
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${DB_NAME}-data
      labels:
        app.kubernetes.io/instance: ${DB_NAME}
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: netapp-block-standard
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${DB_NAME}
      labels:
        app.kubernetes.io/instance: ${DB_NAME}
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: ${DB_NAME}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ${DB_NAME}
            app.kubernetes.io/instance: ${DB_NAME}
        spec:
          containers:
            - name: postgis
              image: postgis/postgis:17-3.4-alpine
              ports:
                - name: postgres
                  containerPort: 5432
              resources:
                requests:
                  cpu: 50m
                  memory: 350Mi
                limits:
                  cpu: 1
                  memory: 1Gi
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET}
                      key: POSTGRES_DB
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET}
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET}
                      key: POSTGRES_PASSWORD
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "ride", "-d", "${DB_NAME}"]
                initialDelaySeconds: 5
                periodSeconds: 5
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ${DB_NAME}-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${DB_NAME}
      labels:
        app.kubernetes.io/instance: ${DB_NAME}
    spec:
      selector:
        app.kubernetes.io/name: ${DB_NAME}
      ports:
        - name: postgres
          port: 5432
          targetPort: postgres
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${DB_NAME}
      labels:
        app.kubernetes.io/instance: ${DB_NAME}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ${DB_NAME}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: pr-${PR}-ride-webapp
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: pr-${PR}-ride-tasks
          ports:
            - protocol: TCP
              port: 5432
      policyTypes:
        - Ingress

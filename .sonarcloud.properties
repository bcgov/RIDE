sonar.organization=bcgov-sonarcloud
sonar.projectKey=bcgov_RIDE
sonar.host.url=https://sonarcloud.io

sonar.sources=src/frontend,src/webapp

# Email templates need table layout attributes (width, bgcolor, cellpadding,
# align...) for Outlook, which Sonar flags as deprecated.  Automatic analysis
# reads only file exclusions from this file, not rule ignores.
sonar.exclusions=**/templates/email/**

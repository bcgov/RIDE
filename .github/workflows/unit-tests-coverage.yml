name: Unit tests/Code Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run Tests

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      postgres:
        image: postgis/postgis:17-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
        # Wait until postgres is ready to accept connections before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./src/webapp/requirements/base.txt
          pip install coverage

      - name: Run Tests
        working-directory: ./src/webapp
        env:
          SECRET_KEY: testvar
          DEBUG: False
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CORS_ORIGIN_WHITELIST: http://localhost:8000,http://localhost:3000
          DJANGO_CSRF_COOKIE_SECURE: false
          DJANGO_SECURE_SSL_REDIRECT: false
          DJANGO_SESSION_COOKIE_SECURE: false
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
          DJANGO_EMAIL_HOST: testvar
          DJANGO_EMAIL_PORT: 1
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: testpw
          DB_HOST: localhost
          DB_PORT: 5432
          KEYCLOAK_CLIENT_ID: test-client
          KEYCLOAK_SECRET: test-secret
          KEYCLOAK_URL: https://testurl.test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ROUTE_PLANNER_API_URL: http://route-mock:8080
          ROUTE_PLANNER_API_KEY: test-key
          OPEN511_API_URL: http://open511-mock:8080
          OPEN511_API_KEY: test-key
        run: |
          coverage run manage.py test --noinput
          coverage report
          coverage xml

name: 1a. Build & Deploy to PR Branch
# Builds a preview environment for same-repository PRs that are ready for review (not drafts)
# and do not have the `No Preview` label.
# It provisions a temporary PostGIS database, builds the application, deploys to OpenShift Gold,
# and posts the preview URLs as a PR comment. Converting the PR to a draft or adding
# `No Preview` tears the environment down (see pr-cleanup.yml).

on:
  pull_request:
    # `unlabeled` is only acted on for `No Preview`; other label changes do not affect the preview.
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]

concurrency:
  # Ineligible events (forks, drafts, `No Preview`, other labels being removed) get their own
  # group, so they neither cancel an in-flight deploy nor compete with cleanup for the PR lock.
  group: pr-env-${{ github.event.pull_request.number || github.ref_name }}${{ (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'No Preview') || (github.event.action == 'unlabeled' && github.event.label.name != 'No Preview')) && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup Job to define outputs
    # Same rule as the concurrency group above: same repository, not a draft, no `No Preview`
    # label, and not the removal of some other label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'No Preview') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'No Preview')
    outputs:
      environment_name: dev            # reuse the dev GitHub environment for vars/secrets
      helm_release_name: pr-${{ github.event.pull_request.number }}-ride
      image_registry: ghcr.io
      openshift_gold_url: https://pr-${{ github.event.pull_request.number }}-ride.apps.gold.devops.gov.bc.ca
      custom_tag: type=raw,value=pr-${{ github.event.pull_request.number }}
      tag_for_helm: sha-${{ github.sha }}
    steps:
      - name: Set outputs
        run: echo "This step is required to set job outputs."

  build-and-push:
    needs: [setup]
    runs-on: ubuntu-latest
    name: Build & Push ${{ matrix.name }} Image
    environment: ${{ needs.setup.outputs.environment_name }}
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    strategy:
      matrix:
        include:
          - name: Webapp
            image_name: ${{ github.repository }}-webapp
            dockerfile: ./compose/webapp/Dockerfile
            build_args: |
              DEBUG_BUILD=false
              INCLUDE_SEED_DATA=true
            needs_fontawesome: false
          - name: Static
            image_name: ${{ github.repository }}-static
            dockerfile: ./compose/frontend/StaticBuild
            build_args: |
              DEBUG_BUILD=true
              SOURCEMAP=true
            needs_fontawesome: true
          - name: Redis
            image_name: ${{ github.repository }}-redis
            dockerfile: ./compose/redis/Dockerfile
            build_args: |
              DEBUG_BUILD=false
            needs_fontawesome: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ needs.setup.outputs.image_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ needs.setup.outputs.image_registry }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=long
            ${{ needs.setup.outputs.custom_tag }}
            
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
  
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          secrets: |
            ${{ matrix.needs_fontawesome && format('FONTAWESOME_PACKAGE_TOKEN={0}', secrets.FONTAWESOME_PACKAGE_TOKEN) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-openshift-gold:
    needs: [setup, build-and-push]
    runs-on:
        group: Larger Runners - OpenShift Static-IP
    name: Deploy to Gold. Tag ${{ needs.setup.outputs.tag_for_helm }}
    environment:
      name: ${{ needs.setup.outputs.environment_name }}
      url: ${{ needs.setup.outputs.openshift_gold_url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: OC Setup
      uses: ./.github/actions/oc-setup
      with:
        server: ${{ vars.OPENSHIFT_GOLD_SERVER }}
        token: ${{ secrets.OPENSHIFT_GOLD_TOKEN }}
        namespace: ${{ vars.OPENSHIFT_NAMESPACE }}

    - name: Deploy temporary PostGIS database
      env:
        PR: ${{ github.event.pull_request.number }}
      run: |
        DB_NAME="pr-${PR}-ride-db"
        DB_SECRET="${DB_NAME}-connection"
        DB_DEPLOYMENT_EXISTS="$(oc get deployment "$DB_NAME" --ignore-not-found -o name)"
        if [ -z "$DB_DEPLOYMENT_EXISTS" ]; then
          DB_SECRET_EXISTS="$(oc get secret "$DB_SECRET" --ignore-not-found -o name)"
          if [ -z "$DB_SECRET_EXISTS" ]; then
            DB_PASSWORD_BASE64="$(openssl rand -hex 32 | tr -d '\n' | base64 | tr -d '\n')"
          else
            DB_PASSWORD_BASE64="$(oc get secret "$DB_SECRET" -o jsonpath='{.data.password}')"
            if [ -z "$DB_PASSWORD_BASE64" ]; then
              echo "Database secret ${DB_SECRET} is missing the password key" >&2
              exit 1
            fi
          fi
          echo "::add-mask::$DB_PASSWORD_BASE64"

          oc process -f ./infrastructure/pr-postgis-template.yaml \
            -p PR="$PR" \
            -p DB_NAME="$DB_NAME" \
            -p DB_SECRET="$DB_SECRET" \
            -p DB_NAME_BASE64="$(printf '%s' "$DB_NAME" | base64 | tr -d '\n')" \
            -p DB_PASSWORD_BASE64="$DB_PASSWORD_BASE64" \
            | oc apply -f -
        else
          echo "Database deployment ${DB_NAME} already exists; skipping database deployment"
          DB_SECRET_EXISTS="$(oc get secret "$DB_SECRET" --ignore-not-found -o name)"
          if [ -z "$DB_SECRET_EXISTS" ]; then
            echo "Database secret ${DB_SECRET} is missing; cannot deploy the application" >&2
            exit 1
          fi
        fi

        oc rollout status "deployment/${DB_NAME}" --timeout=5m

    - name: Deploy PR application
      env:
        PR: ${{ github.event.pull_request.number }}
        PR_RELEASE: ${{ needs.setup.outputs.helm_release_name }}
        PR_DB_SECRET: pr-${{ github.event.pull_request.number }}-ride-db-connection
        BRANCH: ${{ github.head_ref }}
      run: |
        helm dependency update ./infrastructure/main
        helm upgrade --install "$PR_RELEASE" \
          -f ./infrastructure/main/values-${{ needs.setup.outputs.environment_name }}.yaml \
          ./infrastructure/main \
          --set global.image.tag="${{ needs.setup.outputs.tag_for_helm }}" \
          --set-string global.branch="$BRANCH" \
          --set global.host="pr-${PR}-ride.apps.gold.devops.gov.bc.ca" \
          --set-string webapp.nameOverride="${PR_RELEASE}-webapp" \
          --set-string webapp.fullnameOverride="${PR_RELEASE}-webapp" \
          --set-string static.nameOverride="${PR_RELEASE}-static" \
          --set-string static.fullnameOverride="${PR_RELEASE}-static" \
          --set-string static.route.host="${PR_RELEASE}.apps.gold.devops.gov.bc.ca" \
          --set static.route.vanityurl=false \
          --set-string static.deployment.env.variables.VITE_API_HOST_OVERRIDE="https://${PR_RELEASE}.apps.gold.devops.gov.bc.ca" \
          --set-string static.deployment.env.variables.WEBAPP_SERVICE_OVERRIDE="${PR_RELEASE}-webapp" \
          --set-string redis.nameOverride="${PR_RELEASE}-redis" \
          --set-string redis.fullnameOverride="${PR_RELEASE}-redis" \
          --set-string redis.serviceAccountName="dev-ride-redis" \
          --set-string webapp.deployment.redisHost="${PR_RELEASE}-redis" \
          --set-string webapp.deployment.frontendBaseUrl="https://${PR_RELEASE}.apps.gold.devops.gov.bc.ca/" \
          --set-string tasks.nameOverride="${PR_RELEASE}-tasks" \
          --set-string tasks.fullnameOverride="${PR_RELEASE}-tasks" \
          --set-string tasks.deployment.redisHost="${PR_RELEASE}-redis" \
          --set-string webapp.deployment.env.postgresSecret="$PR_DB_SECRET" \
          --set-string tasks.deployment.env.postgresSecret="$PR_DB_SECRET" \
          --wait --timeout 15m
          
    - name: Seed PR database (first deploy only)
      env:
        PR: ${{ github.event.pull_request.number }}
        RIDE_ADMIN_IDIRS: ${{ vars.PR_ADMIN_IDIRS }}
      run: |
        WEBAPP="deploy/pr-${PR}-ride-webapp"
        if oc exec "$WEBAPP" -- sh -c '. /vault/secrets/secrets.env && python manage.py shell -c "import sys; from apps.users.models import RIDEUser; sys.exit(0 if RIDEUser.objects.filter(username__startswith=\"sample_\").exists() else 1)"'; then
          echo "Already seeded"; exit 0
        fi
        oc exec "$WEBAPP" -- sh -c ". /vault/secrets/secrets.env && RIDE_ADMIN_IDIRS='${RIDE_ADMIN_IDIRS}' python manage.py seed_data --clear --seed ${PR}"

          

    - name: Post preview URLs to PR
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        PR_RELEASE: ${{ needs.setup.outputs.helm_release_name }}
        PREVIEW_URL: ${{ needs.setup.outputs.openshift_gold_url }}
        NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE }}
        REPO: ${{ github.repository }}
      run: |
        # The heading identifies this comment; pr-cleanup.yml matches the same text to delete it.
        CONSOLE="https://console.apps.gold.devops.gov.bc.ca"
        BODY="$(printf '%s\n' \
          "OpenShift URLs for the PR Deployment:" \
          "- App Route: ${PREVIEW_URL}/" \
          "- Django Admin: ${PREVIEW_URL}/admin/" \
          "- Pods: ${CONSOLE}/k8s/ns/${NAMESPACE}/pods?name=${PR_RELEASE}" \
          "- Helm Release: ${CONSOLE}/helm-releases/ns/${NAMESPACE}/release/${PR_RELEASE}")"

        # Only comments posted by this workflow, so a person quoting the heading is never edited.
        # "Preview environment:" is the earlier format of this comment.
        COMMENT_ID="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
          --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body | startswith("OpenShift URLs for the PR Deployment:")) or (.body | startswith("Preview environment:")))) | .id' \
          | head -n 1)"

        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          echo "Updated preview comment ${COMMENT_ID}"
        else
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$BODY" > /dev/null
          echo "Posted preview comment"
        fi
